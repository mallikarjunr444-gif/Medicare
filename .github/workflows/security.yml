name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Gitleaks (secret scan, full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep CE (SAST)
        run: |
          pip install semgrep==1.*
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/owasp-top-ten --config p/typescript --config p/javascript \
            workers/api/src frontend/app frontend/lib frontend/components frontend/store
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (dependencies, IaC, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
  api-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workers/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: workers/api/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
  frontend-audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Fails only on critical; the 4 remaining highs are the unused firebase/firestore->grpc-js chain (documented).
      - run: npm audit --audit-level=critical
      - run: npm run build
